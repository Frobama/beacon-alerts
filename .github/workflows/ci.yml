name: ci

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beacon
          POSTGRES_PASSWORD: beacon
          POSTGRES_DB: alerts_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U beacon -d alerts_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Generar stubs de contratos
        run: make proto

      - uses: actions/setup-go@v5
        if: hashFiles('go.mod') != ''
        with:
          go-version-file: go.mod

      - name: Vet
        if: hashFiles('go.mod') != ''
        run: go vet ./...

      - name: Cobertura con umbral
        if: hashFiles('go.mod') != ''
        env:
          TEST_DATABASE_URL: postgres://beacon:beacon@localhost:5433/alerts_test?sslmode=disable
          RACE_FLAG: "-race"
        run: make coverage

      - name: Subir reporte de cobertura
        if: hashFiles('go.mod') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-alerts
          path: coverage.out

      - uses: docker/setup-buildx-action@v3
        if: hashFiles('Dockerfile') != ''

      - name: Build de imagen
        if: hashFiles('Dockerfile') != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}

      - name: Trivy
        if: hashFiles('Dockerfile') != ''
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:sha-${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  publish:
    needs: ci
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern=v{{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}

  notify-infra:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Avisar a infra
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "sin INFRA_DISPATCH_TOKEN: se omite el aviso"
            exit 0
          fi
          gh api repos/Frobama/beacon-infra/dispatches \
            -f event_type=service-image \
            -f "client_payload[service]=alerts" \
            -f "client_payload[tag]=sha-${GITHUB_SHA}"
